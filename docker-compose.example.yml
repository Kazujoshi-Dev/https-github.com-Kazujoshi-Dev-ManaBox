version: '3.8'

services:
  # Aplikacja MTG Collection
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtg_collection_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://mtg_user:twoje_bezpieczne_haslo@postgres:5432/mtg_db?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}  # ustaw w pliku .env (openssl rand -base64 48)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data

  # Baza danych PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: mtg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtg_user
      POSTGRES_PASSWORD: twoje_bezpieczne_haslo
      POSTGRES_DB: mtg_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg_user -d mtg_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

volumes:
  app_data:
  pg_data:
